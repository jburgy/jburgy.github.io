<script type="text/x-mathjax-config">
    MathJax.Hub.Config({
        jax: ["input/TeX", "output/HTML-CSS"],
        tex2jax: {
            inlineMath: [ ['$', '$'], ["\\(", "\\)"] ],
            displayMath: [ ['$$', '$$'], ["\\[", "\\]"] ],
            processEscapes: true,

        }

    });
</script>
<script type="text/javascript" async
    src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-AMS_HTML">
</script>
<script>
    // Clean up the COOP/COEP service worker (sw.js) older visits registered.
    // Transitional: delete once returning visitors have had time to pick it up.
    navigator.serviceWorker?.getRegistrations().then((registrations) => registrations.forEach((registration) => {
        if (registration.scope === `${location.origin}/` && registration.active?.scriptURL.endsWith("/sw.js")) {
            registration.unregister();
        }
    }));
    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll("iframe").forEach(node => node.focus({ preventScroll: true }));
    }, {once: true});
</script>
