<style>.tag{border:0;border-radius:1em;padding:0 .6em;margin-left:.2em;font-size:.8em;background:#e1ecf4;color:#39739d;cursor:pointer}#tags .tag{background:#39739d;color:#fff}@media(prefers-color-scheme:dark){.tag{background:#23313d;color:#9fbdd3}#tags .tag{background:#3d5f7a;color:#dde8f0}}</style>
<p id="tags"></p>
<ul class="post-list">{% for p in site.posts %}
  <li data-tags="{{ p.tags | join: ' ' }}"><span class="post-meta">{{ p.date | date: "%b %-d, %Y" }}</span>
  <a class="post-link" href="{{ p.url | relative_url }}">{{ p.title | escape }}</a>
  {% for t in p.tags %}<button class="tag" onclick="tf('{{ t }}')">{{ t }}</button>{% endfor %}</li>{% endfor %}
</ul>
<script>
const on = new Set();
function tf(t, off) {
  off ? on.delete(t) : on.add(t);
  document.getElementById('tags').replaceChildren(...[...on].map(t => Object.assign(document.createElement('button'), {className: 'tag', textContent: t + ' ×', onclick: () => tf(t, 1)})));
  document.querySelectorAll('.post-list li').forEach(l => l.hidden = ![...on].every(t => l.dataset.tags.split(' ').includes(t)));
}
</script>
