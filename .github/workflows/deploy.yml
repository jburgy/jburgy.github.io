name: Build and Deploy

on:
  push:
    branches:
      - gh-pages
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync
      - run: uv run --directory docs/jupyter jupyter lite build --contents content --output-dir dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/jupyter/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ format('{0}/jupyter', steps.deployment.outputs.page_url) }}

    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
